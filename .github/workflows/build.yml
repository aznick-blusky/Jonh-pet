name: John pet apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Installazione dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext

      - name: Configurazione di Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Forza python3 a puntare a Python 3.10
        run: |
          sudo ln -sf $(which python) /usr/bin/python3
          python3 --version

      - name: Configurazione di Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Installazione di Buildozer e Cython
        run: |
          pip install --user cython==0.29.36 buildozer

      - name: Compilazione APK con Buildozer
        run: |
          ~/.local/bin/buildozer -v android debug > buildozer_full_log.txt 2>&1 || {
            echo "=========================================="
            echo " ECCO GLI ERRORI TROVATI NEL LOG:"
            echo "=========================================="
            grep -i "error" buildozer_full_log.txt || tail -n 60 buildozer_full_log.txt
            exit 1
          }

      - name: Carica il Log Completo (Senza Troncamento)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer_full_log.txt

      - name: Salvataggio dell'APK generato
        uses: actions/upload-artifact@v4
        with:
          name: john-pet-apk
          path: bin/*.apk
          if-no-files-found: ignore
          
